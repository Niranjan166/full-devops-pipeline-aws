services:

  mysql:
    image: mysql:8.0
    container_name: dms-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: nIRU@1998
      MYSQL_DATABASE: dms_db

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  backend:
    build: ./backend
    container_name: dms-backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition : service_healthy

  frontend:
    build: ./frontend
    container_name: dms-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    
volumes:
  mysql_data: